<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Evidence{% endblock %} · Ephemeral Container Forensics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="plate">
        <a class="plate-title" href="{{ url_for('index') }}">
            <span class="plate-name">Ephemeral Container Forensics</span>
            <span class="plate-sub">Evidence review · read-only</span>
        </a>
        {% block plate_extra %}{% endblock %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
